<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">POZAN capability system</title><desc id="desc">Four floating three-dimensional modules showing frontend, interface, web foundation, and systems skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080e"/><stop offset="1" stop-color="#0c1820"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#52f7d7" stop-opacity="0"/><stop offset=".5" stop-color="#52f7d7" stop-opacity=".8"/><stop offset="1" stop-color="#52f7d7" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="210%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="19"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c8fff5" opacity=".08"/></pattern>
    <style>.display{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",Courier,monospace}.white{fill:#eff8f5}.muted{fill:#8fa3a7}.mint{fill:#52f7d7}.orange{fill:#ff8249}.yellow{fill:#ffe66d}.tiny{font-size:10px;letter-spacing:1.8px}</style>
  </defs>
  <rect width="1200" height="690" rx="22" fill="url(#bg)"/><rect width="1200" height="690" rx="22" fill="url(#dots)"/>
  <text class="mono mint tiny" x="54" y="62">01 / CAPABILITY SYSTEM</text><text class="display white" x="52" y="114" font-size="42">What I bring to the build.</text><text class="mono muted" x="54" y="144" font-size="13">FOUR CONNECTED DISCIPLINES · ONE PRODUCT MINDSET</text>
  <path d="M600 178V608M105 393H1095" stroke="#29434a" stroke-dasharray="4 10"/>
  <circle cx="600" cy="393" r="72" fill="#071116" stroke="#52f7d7" stroke-width="2" filter="url(#glow)"/><circle cx="600" cy="393" r="50" fill="none" stroke="#ff8249" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" values="0;68" dur="7s" repeatCount="indefinite"/></circle><text class="mono white" x="600" y="389" text-anchor="middle" font-size="13" letter-spacing="2">PRODUCT</text><text class="mono mint" x="600" y="410" text-anchor="middle" font-size="10">CORE</text>
  <g transform="translate(100 195)" filter="url(#shadow)"><polygon points="0,28 206,-12 430,46 223,88" fill="#15333a" stroke="#52f7d7"/><polygon points="0,28 223,88 223,198 0,138" fill="#0a6763" stroke="#52f7d7"/><polygon points="223,88 430,46 430,156 223,198" fill="#0c3338" stroke="#52f7d7"/><text class="mono mint tiny" x="24" y="72">PRIMARY / SHIP</text><text class="display white" x="24" y="119" font-size="33">Frontend</text><text class="mono white" x="24" y="151" font-size="13">React · Next.js · TypeScript</text><text class="mono muted" x="249" y="124" font-size="11">COMPONENTS</text><text class="mono muted" x="249" y="145" font-size="11">ARCHITECTURE</text><animateTransform attributeName="transform" type="translate" values="100 195;100 185;100 195" dur="5s" repeatCount="indefinite"/></g>
  <g transform="translate(672 194)" filter="url(#shadow)"><polygon points="0,46 210,-8 426,32 215,87" fill="#3c2914" stroke="#ffe66d"/><polygon points="0,46 215,87 215,197 0,156" fill="#7c5b16" stroke="#ffe66d"/><polygon points="215,87 426,32 426,142 215,197" fill="#41330f" stroke="#ffe66d"/><text class="mono yellow tiny" x="24" y="89">DESIGN / CRAFT</text><text class="display white" x="24" y="135" font-size="33">Interface</text><text class="mono white" x="24" y="167" font-size="13">Figma · Framer · UI/UX</text><text class="mono muted" x="244" y="117" font-size="11">PROTOTYPES</text><text class="mono muted" x="244" y="138" font-size="11">DESIGN SYSTEMS</text><animateTransform attributeName="transform" type="translate" values="672 194;672 204;672 194" dur="5.5s" repeatCount="indefinite"/></g>
  <g transform="translate(102 438)" filter="url(#shadow)"><polygon points="0,28 206,-12 430,46 223,88" fill="#382116" stroke="#ff8249"/><polygon points="0,28 223,88 223,198 0,138" fill="#8f3e20" stroke="#ff8249"/><polygon points="223,88 430,46 430,156 223,198" fill="#492317" stroke="#ff8249"/><text class="mono orange tiny" x="24" y="72">FOUNDATION / BUILD</text><text class="display white" x="24" y="119" font-size="33">Web Core</text><text class="mono white" x="24" y="151" font-size="13">HTML · CSS · JavaScript</text><text class="mono muted" x="249" y="124" font-size="11">SEMANTICS</text><text class="mono muted" x="249" y="145" font-size="11">MOTION</text><animateTransform attributeName="transform" type="translate" values="102 438;102 448;102 438" dur="5.8s" repeatCount="indefinite"/></g>
  <g transform="translate(670 438)" filter="url(#shadow)"><polygon points="0,46 210,-8 426,32 215,87" fill="#182536" stroke="#77a4ff"/><polygon points="0,46 215,87 215,197 0,156" fill="#244d92" stroke="#77a4ff"/><polygon points="215,87 426,32 426,142 215,197" fill="#14294d" stroke="#77a4ff"/><text class="mono tiny" x="24" y="89" fill="#8eb3ff">SYSTEMS / CONNECT</text><text class="display white" x="24" y="135" font-size="33">Backend</text><text class="mono white" x="24" y="167" font-size="13">Node · Firebase · SQL · Git</text><text class="mono muted" x="244" y="117" font-size="11">DATA</text><text class="mono muted" x="244" y="138" font-size="11">DELIVERY</text><animateTransform attributeName="transform" type="translate" values="670 438;670 428;670 438" dur="6.2s" repeatCount="indefinite"/></g>
  <rect x="72" y="661" width="1056" height="2" fill="url(#beam)"><animate attributeName="x" values="72;320;72" dur="6s" repeatCount="indefinite"/></rect>
</svg>
