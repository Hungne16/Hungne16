<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">GitHub metrics for your-username</title><desc id="desc">Repository, star, follower, language, recent activity, and contribution statistics generated from the GitHub API.</desc>
  <defs><linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/><animate attributeName="x1" values="-.3;.2;-.3" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values=".7;1.2;.7" dur="10s" repeatCount="indefinite"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#10182b"/></linearGradient><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.bg{fill:url(#surface)}.card{fill:#111a2d;stroke:#27334c}.panel{fill:#0e1628;stroke:#27334c}.title,.value,.label{fill:#f1f5f9}.muted{fill:#91a0b8}.eyebrow{fill:#9ca9be;font-size:11px;letter-spacing:1.4px}.value{font-size:30px;font-weight:700}.track{fill:#202c43}.level-0{fill:#172136}.level-1{fill:#263b67}.level-2{fill:#4f46a5}.level-3{fill:#7c5ce0}.level-4{fill:#a78bfa}@media(prefers-color-scheme:light){.bg{fill:#f8fafc}.card,.panel{fill:#fff;stroke:#d8e0eb}.title,.value,.label{fill:#152033}.muted,.eyebrow{fill:#5c6b80}.track,.level-0{fill:#e7ecf3}.level-1{fill:#ddd6fe}.level-2{fill:#c4b5fd}.level-3{fill:#a78bfa}.level-4{fill:#7c3aed}}</style></defs>
  <rect class="bg" width="1200" height="650" rx="20"/><rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>
  <text class="title" x="48" y="58" font-size="23" font-weight="700">GITHUB SIGNAL</text><text class="muted" x="48" y="82" font-size="13">@your-username / public activity</text><text class="muted" x="1152" y="64" font-size="12" text-anchor="end">UPDATED 2026-09-06</text>
  <g><rect class="card" x="48" y="115" width="258" height="112" rx="15"/><text class="eyebrow" x="68" y="145">COMMITS</text><text class="value" x="68" y="184">0</text><text class="muted" x="68" y="207" font-size="12">last 12 months</text></g><g><rect class="card" x="330" y="115" width="258" height="112" rx="15"/><text class="eyebrow" x="350" y="145">REPOSITORIES</text><text class="value" x="350" y="184">0</text><text class="muted" x="350" y="207" font-size="12">public work</text></g><g><rect class="card" x="612" y="115" width="258" height="112" rx="15"/><text class="eyebrow" x="632" y="145">STARS EARNED</text><text class="value" x="632" y="184">0</text><text class="muted" x="632" y="207" font-size="12">across repositories</text></g><g><rect class="card" x="894" y="115" width="258" height="112" rx="15"/><text class="eyebrow" x="914" y="145">FOLLOWERS</text><text class="value" x="914" y="184">0</text><text class="muted" x="914" y="207" font-size="12">GitHub community</text></g>
  <rect class="panel" x="48" y="251" width="548" height="187" rx="15"/><text class="eyebrow" x="66" y="282">RECENT ACTIVITY</text><text class="muted" x="60" y="335" font-size="14">Recent public activity will appear here.</text>
  <rect class="panel" x="620" y="251" width="532" height="187" rx="15"/><text class="eyebrow" x="654" y="282">TOP LANGUAGES BY CODE SIZE</text><text class="muted" x="654" y="335" font-size="14">Language data will appear after the first update.</text>
  <text class="eyebrow" x="48" y="466">CONTRIBUTIONS · LAST 12 MONTHS</text><text class="muted" x="1152" y="466" font-size="12" text-anchor="end">0 TOTAL</text><text class="muted" x="60" y="500" font-size="14">Contribution calendar becomes available when GITHUB_TOKEN is present.</text>
</svg>
