<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">POZAN — digital product engineer</title>
  <desc id="desc">An editorial portfolio masthead with a subtle animated lime scan line.</desc>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#f1eee4" opacity=".08"/></pattern>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#c7ff4c" stop-opacity="0"/><stop offset=".45" stop-color="#c7ff4c"/><stop offset=".55" stop-color="#f1eee4"/><stop offset="1" stop-color="#c7ff4c" stop-opacity="0"/></linearGradient>
    <style>
      .display{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",Courier,monospace}.ink{fill:#f1eee4}.muted{fill:#aaa79b}.acid{fill:#c7ff4c}
      @media(prefers-color-scheme:light){.surface{fill:#eeece4}.ink{fill:#151512}.muted{fill:#626058}.line{stroke:#b4b1a5}}
    </style>
  </defs>
  <rect class="surface" width="1200" height="420" rx="18" fill="#151512"/>
  <rect width="1200" height="420" rx="18" fill="url(#grain)"/>
  <path class="line" d="M52 55H1148M52 365H1148" stroke="#5a584f" stroke-width="1"/>
  <path d="M52 55V365" stroke="#c7ff4c" stroke-width="3"/>
  <text class="mono acid" x="76" y="85" font-size="12" letter-spacing="2">01 / PORTFOLIO</text>
  <text class="display ink" x="74" y="212" font-size="132" letter-spacing="-8">POZAN</text>
  <text class="mono muted" x="80" y="250" font-size="15" letter-spacing="1.5">DIGITAL PRODUCT ENGINEER</text>
  <text class="mono ink" x="80" y="292" font-size="16">SOFTWARE / INTERFACE / SYSTEMS</text>
  <g transform="translate(872 106)">
    <rect width="226" height="188" fill="none" stroke="#5a584f"/>
    <path d="M0 94H226M113 0V188" stroke="#5a584f" stroke-width="1"/>
    <circle cx="113" cy="94" r="54" fill="none" stroke="#c7ff4c" stroke-width="2"/>
    <circle cx="113" cy="94" r="8" fill="#c7ff4c"/>
    <text class="mono muted" x="18" y="169" font-size="10" letter-spacing="1.5">CRAFT / 2026</text>
  </g>
  <rect x="76" y="324" width="510" height="2" fill="url(#scan)"><animate attributeName="x" values="76;510;76" dur="5.5s" repeatCount="indefinite"/></rect>
  <rect x="590" y="316" width="8" height="17" fill="#c7ff4c"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.5;1" dur="1.15s" repeatCount="indefinite"/></rect>
  <text class="mono muted" x="1124" y="389" font-size="10" text-anchor="end" letter-spacing="1.2">DESIGNED WITH INTENT</text>
</svg>
