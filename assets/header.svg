<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">POZAN — software engineer and interface designer</title>
  <desc id="desc">A three-dimensional holographic developer workspace with an orbiting isometric core.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04070d"/><stop offset=".55" stop-color="#08111a"/><stop offset="1" stop-color="#101a22"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#52f7d7"/><stop offset=".5" stop-color="#ffe66d"/><stop offset="1" stop-color="#ff6b2c"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183c43"/><stop offset="1" stop-color="#0c232a"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b7771"/><stop offset="1" stop-color="#073a3d"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a4f"/><stop offset="1" stop-color="#8d351b"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#52f7d7" stop-opacity=".22"/><stop offset="1" stop-color="#52f7d7" stop-opacity="0"/></radialGradient>
    <pattern id="micro" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8fff7" opacity=".1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="22"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="500" rx="22"/></clipPath>
    <style>.display{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",Courier,monospace}.white{fill:#f3f8f6}.mint{fill:#52f7d7}.muted{fill:#91a6aa}</style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="500" fill="url(#space)"/><rect width="1200" height="500" fill="url(#micro)"/>
    <ellipse cx="890" cy="250" rx="300" ry="250" fill="url(#halo)"><animate attributeName="rx" values="270;320;270" dur="8s" repeatCount="indefinite"/></ellipse>
    <g opacity=".22" stroke="#52f7d7" fill="none">
      <path d="M560 496L864 286L1168 496M635 496L891 318L1148 496M714 496L918 352L1124 496"/>
      <path d="M590 474H1152M620 449H1128M652 424H1105M685 399H1081M720 374H1056"/>
    </g>
    <path d="M48 42H1152" stroke="url(#edge)" stroke-width="2"/>
    <text class="mono mint" x="50" y="76" font-size="11" letter-spacing="2.6">POZAN / DIGITAL PRODUCT ENGINEER / 2026</text>
    <text class="display white" x="48" y="205" font-size="108" letter-spacing="-6">Build the</text>
    <text class="display white" x="48" y="304" font-size="108" font-style="italic" letter-spacing="-6">unseen.</text>
    <text class="mono muted" x="55" y="354" font-size="14" letter-spacing=".8">FRONTEND ENGINEERING × INTERFACE DESIGN</text>
    <text class="mono white" x="55" y="390" font-size="16">I turn systems into experiences people can feel.</text>
    <g transform="translate(55 427)"><rect width="318" height="34" rx="17" fill="none" stroke="#33515a"/><circle cx="18" cy="17" r="5" fill="#52f7d7" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle><text class="mono muted" x="34" y="22" font-size="11" letter-spacing="1.2">AVAILABLE FOR THE RIGHT IDEA</text></g>
    <g transform="translate(889 246)" filter="url(#shadow)">
      <polygon points="0,-112 150,-34 0,44 -150,-34" fill="url(#top)" stroke="#72ffe3" stroke-width="2"/>
      <polygon points="-150,-34 0,44 0,184 -150,106" fill="url(#left)" stroke="#52f7d7" stroke-width="2"/>
      <polygon points="150,-34 0,44 0,184 150,106" fill="url(#right)" stroke="#ff9b68" stroke-width="2"/>
      <polygon points="0,-77 93,-29 0,19 -93,-29" fill="#061318" stroke="#ffe66d" stroke-width="3"/>
      <text class="mono white" x="0" y="-23" text-anchor="middle" font-size="16" letter-spacing="2">CORE</text>
    </g>
    <g transform="translate(889 232) rotate(-27)" fill="none" stroke="#52f7d7" stroke-width="2" stroke-dasharray="10 11" opacity=".8"><ellipse rx="254" ry="97"><animate attributeName="stroke-dashoffset" values="0;-84" dur="6s" repeatCount="indefinite"/></ellipse></g>
    <g transform="translate(889 232) rotate(28)" fill="none" stroke="#ff6b2c" stroke-width="1.5" stroke-dasharray="4 13" opacity=".7"><ellipse rx="222" ry="78"><animate attributeName="stroke-dashoffset" values="0;102" dur="8s" repeatCount="indefinite"/></ellipse></g>
    <g filter="url(#glow)"><circle cx="665" cy="352" r="7" fill="#52f7d7"><animate attributeName="cy" values="348;358;348" dur="3s" repeatCount="indefinite"/></circle><circle cx="1090" cy="120" r="7" fill="#ffe66d"><animate attributeName="cx" values="1084;1096;1084" dur="4s" repeatCount="indefinite"/></circle><circle cx="1108" cy="388" r="7" fill="#ff6b2c"><animate attributeName="cy" values="380;394;380" dur="3.5s" repeatCount="indefinite"/></circle></g>
    <g class="mono" font-size="10" letter-spacing="1.5"><text x="640" y="378" fill="#52f7d7">UI SYSTEMS</text><text x="1020" y="104" fill="#ffe66d">PRODUCT</text><text x="1050" y="416" fill="#ff9b68">FRONTEND</text></g>
  </g>
</svg>
