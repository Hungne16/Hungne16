<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Developer and designer profile banner</title>
  <desc id="desc">A minimal futuristic banner with an animated aurora and terminal prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b16"/><stop offset="0.55" stop-color="#0b1020"/><stop offset="1" stop-color="#101729"/></linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7f9" stop-opacity="0"/><stop offset="0.32" stop-color="#6ee7f9"/><stop offset="0.68" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/><animate attributeName="x1" values="-0.35;0.15;-0.35" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="0.65;1.15;0.65" dur="9s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.075"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="terminal"><rect x="174" y="225" width="852" height="42" rx="8"/></clipPath>
    <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.backdrop{fill:url(#bg)}.muted{fill:#93a4bd}@media(prefers-color-scheme:light){.backdrop{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1}.heading{fill:#111827}.muted{fill:#526077}.prompt{fill:#6d28d9}}</style>
  </defs>
  <rect class="backdrop" width="1200" height="360" rx="22"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="890" cy="70" rx="330" ry="170" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="820;930;820" dur="12s" repeatCount="indefinite"/></ellipse>
  <path d="M-80 94C210 8 350 178 606 84S1010 6 1280 114" fill="none" stroke="url(#aurora)" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M-80 104C210 18 350 188 606 94S1010 16 1280 124" fill="none" stroke="url(#aurora)" stroke-width="18" stroke-linecap="round" opacity=".08"/>
  <rect class="panel" x="150" y="92" width="900" height="190" rx="18" fill="#0b1020" fill-opacity=".92" stroke="#25314a"/><circle cx="180" cy="121" r="5" fill="#fb7185"/><circle cx="200" cy="121" r="5" fill="#fbbf24"/><circle cx="220" cy="121" r="5" fill="#34d399"/>
  <text class="muted" x="600" y="126" font-size="12" text-anchor="middle" letter-spacing="2">PROFILE / README</text><text class="heading" x="174" y="181" fill="#f8fafc" font-size="31" font-weight="700" letter-spacing="1">DESIGN. BUILD. REFINE.</text><text class="muted" x="175" y="211" font-size="15">Software engineering with a designer's eye.</text>
  <g clip-path="url(#terminal)"><text class="prompt" x="175" y="253" fill="#67e8f9" font-size="16">›</text><text class="heading" x="199" y="253" fill="#e2e8f0" font-size="16">shipping thoughtful experiences</text><rect x="493" y="236" width="9" height="21" rx="1" fill="#a78bfa"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
</svg>
