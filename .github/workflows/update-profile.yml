name: Update profile metrics

on:
  push:
    branches: [main, master]
    paths-ignore:
      - assets/metrics.svg
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-metrics:
    if: github.actor != 'github-actions[bot]' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate GitHub metrics
        run: npm run metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated metrics
        shell: bash
        run: |
          if git diff --quiet -- assets/metrics.svg; then
            echo "Metrics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg
          git commit -m "chore: refresh profile metrics [skip ci]"
          git push
